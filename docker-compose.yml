services:
  postgres:
    image: postgres:18-alpine
    container_name: smartlcl_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smartlcl_dev}
      POSTGRES_USER: ${POSTGRES_USER:-smartlcl_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smartlcl_dev_password}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smartlcl_admin} -d ${POSTGRES_DB:-smartlcl_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  postgres_data:
    name: smartlcl_postgres_data
