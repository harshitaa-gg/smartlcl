name: SmartLCL CI

on:
  push:
    branches: [ main, 'phase/**' ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: smartlcl_dev
          POSTGRES_USER: smartlcl_admin
          POSTGRES_PASSWORD: smartlcl_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements.txt

      - name: Copy .env
        run: cp .env.example .env

      - name: Run database migrations
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: smartlcl_dev
          POSTGRES_USER: smartlcl_admin
          POSTGRES_PASSWORD: smartlcl_dev_password
        run: bash scripts/migrate.sh

      - name: Run pytest test suite
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: smartlcl_dev
          POSTGRES_USER: smartlcl_admin
          POSTGRES_PASSWORD: smartlcl_dev_password
        run: pytest tests/ -v
